server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # FIX: sin URI en proxy_pass -> nginx conserva la ruta completa (/api/...)
    # Antes era "http://orchestrator:8080/" y reescribia /api/wans a /wans (404).
    location /api/ {
        proxy_pass http://orchestrator:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /ws {
        proxy_pass http://orchestrator:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /metrics-proxy/ {
        proxy_pass http://orchestrator:8080/metrics;
    }
}